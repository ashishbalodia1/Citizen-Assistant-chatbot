version: "3.8"

services:
  backend:
    build: ./backend
    container_name: city_guardian_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-password}@database:3306/city_guardian
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: city_guardian_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  database:
    image: mysql:8.0
    container_name: city_guardian_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: city_guardian
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

